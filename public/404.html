<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Redirect to the main page with hash routing
      const repo = '/orebro-plat-shine';
      const path = window.location.pathname.replace(repo, '');
      window.location.replace(repo + '/#' + (path || '/'));
    </script>
  </head>
  <body></body>
</html>
